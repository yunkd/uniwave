<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uniwave Pro - 대학 실습 관리 플랫폼</title>
  <meta name="description" content="전문적인 대학 실습 관리 플랫폼">
  
  <!-- HTTPS 자동 리다이렉션 스크립트 -->
  <script>
    // www.uniwave.co.kr 또는 uniwave.co.kr로 접속 시 https로 자동 리다이렉션
    if (window.location.protocol !== 'https:' && window.location.hostname.includes('uniwave.co.kr')) {
      window.location.href = 'https://' + window.location.hostname + window.location.pathname + window.location.search;
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
